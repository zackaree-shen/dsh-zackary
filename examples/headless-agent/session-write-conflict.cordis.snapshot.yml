# Keyless real-Loader composition for the concurrent-writer refusal. The fixture
# resumes the seeded session through the public agent service and then advances
# that artifact from a second backend instance, so the resumed writer's next
# durable batch must refuse instead of repeating committed sequence numbers.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.DSH_SNAPSHOT_FILE
    overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext:
      maxBytes: 65536
      dshHome: !!js process.cwd() + '/.dsh'
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

# Resumes the seeded session, then advances its artifact as a second writer.
- id: conflict-writer
  name: './tests/fixtures/session-write-conflict-writer.ts'
