ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
ui-conversation:
  busyEnter: steer
dsh-better-sidebar:
  openByDefault: false
  titleBarCompat: true
ui-theme:
  preference: system
dsh-community-market:
  sources:
    - sourceRecordId: 1d90f0b0-9db4-49ae-ae0e-f408b629d6b8
      registrationKind: built-in
      adapterId: market.dsh-1024store-v1
      providerId: com.deepseek1024.catalog
      builtInProviderKey: dsh-1024store
      enabled: true
      order: 0
    - sourceRecordId: f38345af-99aa-4df9-afc4-a814dd881c14
      registrationKind: built-in
      adapterId: market.dshfind-v1
      providerId: com.dshfind.catalog
      builtInProviderKey: dshfind
      enabled: false
      order: 1
agent-default-model:
  provider: my-deepseek
  model: deepseek-v4-flash-vision-exp
llm-pi-ai:
  providers:
    zai-coding-cn:
      apiKeyEnv: ZAI_CODING_CN_API_KEY
    my-deepseek:
      displayName: My DeepSeek
      apiKeyEnv: MY_DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      models:
        - id: deepseek-v4-flash
          name: deepseek-v4-flash
        - id: deepseek-v4-pro
          name: deepseek-v4-pro
        - id: deepseek-v4-flash-vision-exp
          name: deepseek-v4-flash-vision-exp
          input: [text, image]
skin-background:
  enabled: true
  backgroundOpacity: 0
skin-custom-theme:
  applied: false
llm-deepseek:
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      contextWindow: 1000000
    - id: deepseek-v4-flash-vision-exp
      name: deepseek-v4-flash-vision-exp
      inputModalities: [text, image]
dsh-desktop:
  mode: compatibility
  macosMaterial: transparent
  windowsMaterial: acrylic
  openBrowser: false
  networkExposure: loopback
dsh-desktop-notifications:
  enabled: true
  notifyOnTurnCompletion: true
  notifyOnTurnFailure: true
  notifyOnJobCompletion: true
  notifyOnJobFailure: true
skin-wallpaper:
  enabled: false
