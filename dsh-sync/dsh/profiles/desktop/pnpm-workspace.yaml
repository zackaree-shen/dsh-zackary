packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  # 需要与 web profile 一致：dsh-web-all 带入 @linxin666/dsh-ssh / remote-web-ui
  cloudflared: true
  cpu-features: true
  node-pty: true
  protobufjs: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@linxin666/*'
  # Fast-moving transitive deps of dsh-better-sidebar. A synced lockfile can pin
  # a version newer than another machine's minimumReleaseAge window, which fails
  # the whole install with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
  - '@lezer/*'
  - '@codemirror/*'
  - dsh-click@0.3.24
overrides:
  # desktop 运行时（App 内置 0.2.1-rc.5）需要 0.4.x 的皮肤中心；
  # @linxin666/dsh-skins@0.2.9 会把 0.2.9 提升到根，web-all 的 0.4.x 被挤掉，
  # 结果「设置」里没有皮肤入口。强制统一到 0.4.14。
  '@linxin666/dsh-client-ui-skin-center': 0.4.14
  # 0.4.15 起 peer 要求 @deepseek-ai/dsh >= 0.2.2-rc.1，而本机 App 内核是 0.2.1-rc.5；
  # web-all 0.4.14 对下面三个包声明的是 ^0.4.14，不钉住会浮动到 0.4.15。
  '@linxin666/dsh-pet': 0.4.14
  '@linxin666/dsh-client-ui-preset-center': 0.4.14
  '@linxin666/dsh-client-ui-community-plugins': 0.4.14
